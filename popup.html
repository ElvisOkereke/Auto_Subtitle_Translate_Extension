<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Subtitle Translator</title>
    <style>
        body {
            width: 320px;
            min-height: 400px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8f9fa;
        }
        
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        .logo {
            width: 48px;
            height: 48px;
            margin: 0 auto 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }
        
        h1 {
            margin: 0;
            font-size: 18px;
            color: #333;
        }
        
        .toggle-section {
            margin-bottom: 24px;
            text-align: center;
        }
        
        .toggle-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }
        
        .toggle-button:hover {
            background: #5a67d8;
            transform: translateY(-1px);
        }
        
        .toggle-button.active {
            background: #48bb78;
        }
        
        .toggle-button.active:hover {
            background: #38a169;
        }
        
        .settings-section {
            margin-bottom: 20px;
        }
        
        .setting-group {
            margin-bottom: 16px;
        }
        
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #4a5568;
            font-size: 14px;
        }
        
        select, input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 14px;
            background: white;
            box-sizing: border-box;
        }
        
        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .status {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            text-align: center;
            margin-bottom: 16px;
        }
        
        .status.success {
            background: #f0fff4;
            color: #38a169;
            border: 1px solid #9ae6b4;
        }
        
        .status.error {
            background: #fed7d7;
            color: #e53e3e;
            border: 1px solid #feb2b2;
        }
        
        .status.warning {
            background: #fefcbf;
            color: #d69e2e;
            border: 1px solid #faf089;
        }
        
        .footer {
            text-align: center;
            font-size: 12px;
            color: #718096;
            border-top: 1px solid #e2e8f0;
            padding-top: 12px;
            margin-top: 20px;
        }
        
        
        .mode-switch {
            display: flex;
            background: #e2e8f0;
            border-radius: 8px;
            padding: 3px;
            margin-bottom: 16px;
        }

        .mode-button {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            color: #4a5568;
        }

        .mode-button.active {
            background: white;
            color: #2d3748;
            font-weight: 600;
            box-shadow: 0 1px 2px rgba(0,0,0,0.12);
        }

        .panel-row {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .page-text-section {
            margin-bottom: 24px;
            padding-top: 12px;
            border-top: 1px solid #e2e8f0;
            text-align: center;
        }

        .hidden {
            display: none;
        }

        .setting-status { font-size: 12px; color: #b91c1c; min-height: 0; margin: 2px 0 6px; }
        .setting-status:empty { display: none; }
        .small-button { margin: 4px 4px 0 0; padding: 4px 10px; font-size: 12px; }
        .account-line { font-size: 13px; margin: 2px 0; }
        #accountUsageBar { width: 100%; height: 8px; }
        .account-buttons { margin-top: 6px; }
        #accountStatus.ok { color: #15803d; }
        #glossarySection summary { cursor: pointer; font-weight: 600; margin-bottom: 6px; }
        #glossaryTopic { color: #475569; }
        .glossary-row { display: grid; grid-template-columns: 1fr 1.4fr auto; gap: 6px; align-items: center; margin: 4px 0; }
        .glossary-row .glossary-source { font-size: 13px; overflow-wrap: anywhere; }
        .glossary-row input { min-width: 0; }
        .glossary-row button { padding: 2px 8px; }
        .glossary-empty { font-size: 12px; color: #64748b; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🎬</div>
        <h1>Auto Subtitle Translator</h1>
    </div>
    
    <div id="status" class="status hidden"></div>
    
    <div class="mode-switch" role="tablist">
        <button id="modeAudio" class="mode-button active" role="tab">Audio</button>
        <button id="modeSubtitles" class="mode-button" role="tab">Subtitles</button>
    </div>

    <!-- Audio mode: live captions from the tab's speech -->
    <div id="audioPanel" class="toggle-section">
        <button id="toggleButton" class="toggle-button">Start Subtitles</button>
    </div>

    <!-- Subtitles mode: translate subtitles burned into the video -->
    <div id="subtitlePanel" class="toggle-section hidden">
        <div class="setting-group" style="text-align: left;">
            <label for="subtitleLanguage">Subtitle language:</label>
            <select id="subtitleLanguage">
                <option value="ko">Korean</option>
                <option value="ja">Japanese</option>
                <option value="zh-Hans">Chinese (Simplified)</option>
                <option value="zh-Hant">Chinese (Traditional)</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="pt">Portuguese</option>
                <option value="ru">Russian</option>
            </select>
        </div>
        <div class="panel-row">
            <button id="startSubtitleMode" class="toggle-button hidden" style="background: #38a169;">Start (saved box)</button>
            <button id="drawSubtitleBox" class="toggle-button">Draw subtitle box</button>
            <button id="stopSubtitleMode" class="toggle-button hidden" style="background: #e53e3e;">Stop</button>
        </div>
        <div id="subtitleModeStatus" class="status hidden" style="margin-top: 12px;"></div>
    </div>

    <!-- Page text: one-shot translation of text under a box (available in both modes) -->
    <div class="page-text-section">
        <button id="screenTranslateButton" class="toggle-button" style="background: #38a169;">Screen Translate</button>
        <div id="screenTranslateStatus" class="status hidden" style="margin-top: 12px;"></div>
        <button id="drawNewBoxButton" class="toggle-button hidden" style="margin-top: 8px; background: #2196F3;">Draw New Box</button>
    </div>
    
    <div class="settings-section" id="accountSection">
        <div class="setting-group">
            <label>Account (hosted translation)</label>
            <div id="signedOutView">
                <input type="email" id="accountEmail" placeholder="you@example.com" autocomplete="email">
                <button id="accountSendCode" type="button" class="small-button">Send sign-in code</button>
                <div id="accountCodeRow" class="hidden">
                    <input type="text" id="accountCode" inputmode="numeric" maxlength="6" placeholder="6-digit code" autocomplete="one-time-code">
                    <button id="accountSignIn" type="button" class="small-button">Sign in</button>
                </div>
            </div>
            <div id="signedInView" class="hidden">
                <div id="accountEmailShown" class="account-line"></div>
                <div id="accountPlan" class="account-line"></div>
                <div id="accountUsage" class="account-line"></div>
                <progress id="accountUsageBar" max="1" value="0"></progress>
                <div class="account-buttons">
                    <button id="accountSubscribeStandard" type="button" class="small-button hidden">Subscribe - Standard $9.99/mo</button>
                    <button id="accountSubscribePro" type="button" class="small-button hidden">Subscribe - Pro $24.99/mo</button>
                    <button id="accountManage" type="button" class="small-button hidden">Manage subscription</button>
                    <button id="accountSignOut" type="button" class="small-button">Sign out</button>
                </div>
            </div>
            <div class="setting-status" id="accountStatus" role="status"></div>
        </div>
    </div>

    <div class="settings-section">
        
        <div class="setting-group">
            <label for="sourceLanguage">Source Language:</label>
            <select id="sourceLanguage">
                <option value="auto">Auto-detect</option>
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="hi">Hindi</option>
                <option value="ru">Russian</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label for="targetLanguage">Target Language:</label>
            <select id="targetLanguage">
                <option value="en">English</option>
                <option value="es">Spanish</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="it">Italian</option>
                <option value="pt">Portuguese</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
                <option value="zh">Chinese</option>
                <option value="ar">Arabic</option>
                <option value="hi">Hindi</option>
                <option value="ru">Russian</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label for="subtitleStyle">Subtitle Position:</label>
            <select id="subtitleStyle">
                <option value="bottom">Bottom</option>
                <option value="top">Top</option>
                <option value="center">Center</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label for="fontSize">Font Size:</label>
            <select id="fontSize">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
                <option value="x-large">Extra Large</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label for="translationProvider">Translation Provider:</label>
            <select id="translationProvider">
                <option value="google">Google Translate</option>
                <option value="deepl">DeepL</option>
                <option value="subscription">Subscription (signed in)</option>
            </select>
        </div>

        <div class="setting-group" id="googleApiKeyGroup">
            <label for="googleTranslateApiKey">Google Translate API Key:</label>
            <input type="password" id="googleTranslateApiKey" placeholder="Paste your API key">
        </div>

        <div class="setting-group hidden" id="deeplApiKeyGroup">
            <label for="deeplApiKey">DeepL API Key:</label>
            <input type="password" id="deeplApiKey" placeholder="Paste your API key">
        </div>

        <div class="setting-group">
            <label for="engineMode">Translation engine:</label>
            <select id="engineMode">
                <option value="fast-then-best">Fast then best (DeepL, then Claude)</option>
                <option value="fast">Fast only</option>
                <option value="best">Best only (Claude)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="claudeModel">Claude model:</label>
            <select id="claudeModel">
                <option value="claude-opus-5-5">Claude Opus 5.5 (best)</option>
                <option value="claude-sonnet-5-5">Claude Sonnet 5.5 (faster)</option>
                <option value="claude-haiku-5-5">Claude Haiku 5.5 (cheapest)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="claudeAccess">Claude access:</label>
            <select id="claudeAccess">
                <option value="key">Anthropic API key</option>
                <option value="gateway">Anthropic-compatible gateway</option>
                <option value="subscription">Subscription (signed in)</option>
            </select>
        </div>

        <div class="setting-group" id="anthropicKeyGroup">
            <label for="anthropicApiKey">Anthropic API Key:</label>
            <input type="password" id="anthropicApiKey" placeholder="sk-ant-...">
        </div>

        <div class="setting-group hidden" id="claudeGatewayGroup">
            <label for="claudeGatewayUrl">Gateway URL:</label>
            <input type="url" id="claudeGatewayUrl" placeholder="https://gateway.example.com/anthropic">
            <label for="claudeGatewayToken">Gateway token:</label>
            <input type="password" id="claudeGatewayToken" placeholder="Paste your token">
            <label for="claudeGatewayAuth">Send token as:</label>
            <select id="claudeGatewayAuth">
                <option value="bearer">Authorization: Bearer</option>
                <option value="x-api-key">x-api-key</option>
            </select>
        </div>
        <div class="setting-status" id="claudeStatus" role="status"></div>

        <details class="setting-group" id="glossarySection">
            <summary>Glossary for this video</summary>
            <div id="glossaryTopic" class="setting-status"></div>
            <div id="glossaryList"></div>
        </details>
    </div>
    
    <div class="footer">
        Auto Subtitle Translator v1.0.0
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
